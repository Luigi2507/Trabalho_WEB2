<header class="cabecalho-funcionario">
    <div class="logo">
        <img src="images/logoWT.png" alt="logo WebTech" class="logo-icone">
    </div>

    <div class="area-direita">
        <nav class="menu">
            <a routerLink="/categorias/listar" class="menu-item">Categorias</a>
            <a routerLink="/equipamentos/listar" class="menu-item">Equipamentos</a>
        </nav>
        <a routerLink="/login" class="botao-sair">Sair</a>
    </div>
</header>

<div class="conteudo-central">
    <h1>Editar Categoria de Equipamento</h1>
    <div class="card">
        <form #categoriaForm="ngForm" (ngSubmit)="salvar(categoriaForm)">
            <div class="form-group">
                <label class="form-label" for="nome">Nome</label>
                <input type="text" id="nome" class="form-control" [(ngModel)]="categoria.nome" name="nome" required
                    minlength="2" #nome="ngModel">

                <div class="alert-danger" *ngIf="nome.invalid && nome.touched">
                    <div *ngIf="nome.errors?.['required']">O nome da categoria é obrigatório.</div>
                    <div *ngIf="nome.errors?.['minlength']">O nome da categoria deve ter no mínimo 2 caracteres.</div>
                </div>
            </div>

            <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn-primary" [disabled]="categoriaForm.invalid">Salvar</button>
                <a routerLink="/categorias/listar" class="botao-voltar">Cancelar</a>
            </div>
        </form>
    </div>
</div>
