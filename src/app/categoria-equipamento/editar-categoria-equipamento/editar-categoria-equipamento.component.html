<div class="conteudo-central">
    <h1>Editar Categoria de Equipamento</h1>
    <div class="card">
        <form #categoriaForm="ngForm" (ngSubmit)="salvar(categoriaForm)">
            <div class="form-group">
                <label class="form-label" for="nome">Nome</label>
                <input type="text" id="nome" class="form-control" name="nome" required minlength="2" #nome="ngModel" [(ngModel)]="categoria().nome" (ngModelChange)="categoria.update(c => ({ ...c, nome: $event }))">
                
                @if (nome.invalid && nome.touched){
                    <div class="alert-danger">
                        @if(nome.errors?.['required']){
                            <div>O nome da categoria é obrigatório.</div>
                        }
                        @if(nome.errors?.['minlength']){
                            <div>O nome da categoria deve ter no mínimo 2 caracteres.</div>
                        }
                    </div>
                }
            </div>

            @if(mensagem()){
                <div class="alert-danger">{{ mensagem() }}</div>
            }

            <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn-primary" [disabled]="categoriaForm.invalid">Salvar</button>
                <a routerLink="/categorias/listar" class="botao-voltar">Cancelar</a>
            </div>
        </form>
    </div>
</div>
