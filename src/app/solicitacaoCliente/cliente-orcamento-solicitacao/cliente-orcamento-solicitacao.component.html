<header class="cabecalho-cliente">
  <div class="logo">
    <img src="images/logoMT.png" alt="logo ManuTech" class="logo-icone">
    <span class="logo-texto">ManuTech</span>
  </div>

  <nav class="menu-cliente">
    <a [routerLink]="['/solicitacaoCliente/listar']" class="menu-item">Minhas Solicitações</a>
    <a [routerLink]="['/solicitacaoCliente/nova']" class="menu-item">Nova Solicitação</a>
  </nav>

  <a href="#" class="botao-sair">Sair</a>
</header>

<div class="conteudo-central">
  @if (solicitacao) {
    <h1>Orçamento do Serviço</h1>
    <div class="well">
      <div class="form-group">
        <label>Equipamento:</label>
        <p>{{ solicitacao.descricaoEquipamento }}</p>
      </div>
      <div class="form-group">
        <label>Defeito:</label>
        <p>{{ solicitacao.descricaoDefeito }}</p>
      </div>

      <div class="form-group">
        <label for="orcamentoTemp">Valor Orçado (TEMPORÁRIO — simula o funcionário):</label>
        <input type="number" class="form-control" id="orcamentoTemp" name="orcamentoTemp"
               [(ngModel)]="solicitacao.orcamento" min="0" step="0.01">
      </div>

      <div class="destaque-valor">
        <span>Valor Orçado</span>
        <strong>R$ {{ solicitacao.orcamento | number:'1.2-2' }}</strong>
      </div>

      @if (!mostrarRejeicao) {
        <div class="acoes">
          <button type="button" class="btn-aprovar" (click)="aprovar()">
            <i class="fa fa-check"></i> Aprovar Serviço
          </button>
          <button type="button" class="btn-rejeitar" (click)="abrirRejeicao()">
            <i class="fa fa-times"></i> Rejeitar Serviço
          </button>
          <a class="btn-secondary" [routerLink]="['/solicitacaoCliente/listar']">
            <i class="fa fa-arrow-left"></i> Voltar
          </a>
        </div>
      } @else {
        <div class="form-group">
          <label for="motivo">Motivo da Rejeição:</label>
          <textarea class="form-control" id="motivo" name="motivo"
                    [(ngModel)]="motivoRejeicao" required></textarea>
        </div>
        <div class="acoes">
          <button type="button" class="btn-rejeitar"
                  (click)="confirmarRejeicao()"
                  [disabled]="!motivoRejeicao.trim()">
            <i class="fa fa-check"></i> Confirmar Rejeição
          </button>
          <button type="button" class="btn-secondary" (click)="mostrarRejeicao = false">
            Cancelar
          </button>
        </div>
      }
    </div>
  }
</div>
