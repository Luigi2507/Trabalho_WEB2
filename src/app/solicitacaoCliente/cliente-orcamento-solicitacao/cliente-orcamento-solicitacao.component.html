<header class="cabecalho-cliente">
  <div class="logo">
    <img src="images/logoMT.png" alt="logo ManuTech" class="logo-icone">
    <span class="logo-texto">ManuTech</span>
  </div>

  <nav class="menu-cliente">
    <a [routerLink]="['/solicitacaoCliente/listar']" class="menu-item">Minhas Solicitações</a>
  </nav>

  <a href="#" class="botao-sair" (click)="sair($event)">Sair</a>
</header>

<div class="conteudo-central">
  @if (solicitacao) {
    <h1>Orçamento do Serviço</h1>
    <div class="card">
      <div class="form-group">
        <label>Equipamento:</label>
        <p>{{ solicitacao.descricaoEquipamento }}</p>
      </div>
      <div class="form-group">
        <label>Defeito:</label>
        <p>{{ solicitacao.descricaoDefeito }}</p>
      </div>

      <h3>Valor Orçado:</h3>
      <div class="destaque-valor">
        <strong>R$ {{ solicitacao.orcamento | number:'1.2-2' }}</strong>
      </div>

      @if (!mostrarRejeicao) {
        <div class="acoes">
          <button type="button" class="btn-aprovar" (click)="aprovar()">Aprovar Serviço</button>
          <button type="button" class="btn-rejeitar" (click)="abrirRejeicao()">Rejeitar Serviço</button>
          <a class="botao-voltar " [routerLink]="['/solicitacaoCliente/listar']">Voltar</a>
        </div>
      } @else {
        <div class="form-group">
          <label for="motivo">Motivo da Rejeição:</label>
          <textarea class="form-control" id="motivo" name="motivo" [(ngModel)]="motivoRejeicao" required></textarea>
        </div>
        <div class="acoes">
          <button type="button" class="btn-rejeitar" (click)="confirmarRejeicao()" [disabled]="!motivoRejeicao.trim()">Confirmar Rejeição</button>
          <button type="button" class="botao-voltar " (click)="mostrarRejeicao = false">
            Cancelar
          </button>
        </div>
      }
    </div>
  }
</div>
