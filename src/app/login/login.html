<div class=" login-container">
  <div class="bolinhas-decorativas">
    @for (bolinha of bolinhas; track $index) {
      <span class="bolinha" 
            [style.left.%]="bolinha.left"
            [style.top.%]="bolinha.top"
            [style.width.px]="bolinha.tamanho"
            [style.height.px]="bolinha.tamanho"
            [style.animation-delay.s]="bolinha.delay"
            [style.animation-duration.s]="bolinha.duracao"
            [style.background]="bolinha.cor">
      </span>
    }
    </div>

<div class="card">

  <div class="painel-esquerdo">

      <div class="logo">
  <div class="logo-icone">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
  </div>

  <span class="nome-logo">ManuTech</span>
</div>

    <div class="area-formulario">
      <div class="abas">
        <button class="aba login" type="button" routerLink="/login">Login</button>
        <button class="aba" type="button" routerLink="/cadastro">Cadastro</button>
      </div>

        <div class="arcos-decorativos">
          <span class="arco arco-1">\</span>
          <span class="arco arco-2">\</span>
          <span class="arco arco-3">\</span>
        </div>

      <form>
        <div class="campo mb-3">
          <div class="campo-icone">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 6l9 7 9-7"/>
            </svg>
          </div>
          <input type="email" class="form-control" placeholder="E-mail" required>
        </div>

        <div class="campo">
          <div class="campo-icone">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="9" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
          </div>
          <input type="password" class="form-control" placeholder="Senha" required>
        </div>

        <div class="linha-acoes">
          <a href="#" class="esqueci-senha">Esqueceu sua senha?</a>
          <button type="submit" 
                  class="btn botao-entrar" 
                  [disabled]="btnDesativado" 
                  [class.btnCarregando]="btnCarregando"
                  (click)="btnLoginAnimacao()">{{btnLoginTexto}}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
