<div class="cadastro-container">

    <header class="cadastro-header">
        <div class="logo">
            <div class="logo-icone">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </div>
            <h1 class="nome-logo">ManuTech</h1>
        </div>

        <div class="abas">
            <button class="aba login" type="button" routerLink="/login">Login</button>
            <button class="aba cadastro" type="button" routerLink="/cadastro">Cadastro</button>
        </div>

        <p>Preencha seus dados para realizar o cadastro.</p>
    </header>

    <div class="area-formulario">
        <main>
           <form class="row g-4">
                <!--DADOS PESSOAIS-->
               <section class="col-md-6">
                    <h2>Dados pessoais</h2>

                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type='text' id="cpf" class="form-control" name="cpf" placeholder="Digite seu CPF"
                        maxlength="14"
                        [(ngModel)]="cpf" (input)="formatarCPF()">
                    </div>

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" id="nome" class="form-control" name="nome" placeholder="Digite seu Nome Completo" [(ngModel)]="nome">
                    </div>

                    <div class="mb-3"> 
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" name="email" placeholder="Digite seu Email" [(ngModel)]="email">
                    </div>  

                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" id="telefone" class="form-control" name="telefone" placeholder="Digite seu Telefone"
                        maxlength="15"
                        [(ngModel)]="telefone" (input)="formatarTelefone()">
                    </div>  
                </section>

                <!--DADOS DE ENDEREÇO-->
                <section class="col-md-6">
                <h2>Endereço</h2>

                <div class="mb-3">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" id="cep"  class="form-control" name="cep" placeholder="Digite seu CEP"
                    maxlength="9"
                    [(ngModel)]="cep" (input)="formatarCEP()"
                    (ngModelChange)="buscarCEP()">
                </div>

                <div class="mb-3">
                    <label for="logradouro" class="form-label">Logradouro</label>
                    <input type="text" id="logradouro"  class="form-control" name="logradouro" 
                    [(ngModel)]="logradouro" readonly>
                </div>
                
                <div class="row g-3 mb-3">
                    <div class="col-6">
                    <label for="numero" class="form-label">Número</label>
                    <input type="text" id="numero"  class="form-control" name="numero" placeholder="Digite o Número"
                    [(ngModel)]="numero" (input)="somenteNumeros()">
                    </div>

                    <div class="col-6">
                    <label for="complemento" class="form-label">Complemento</label>
                    <input type="text" id="complemento"  class="form-control" name="complemento" placeholder="Apartamento, Bloco, etc">
                    </div>

                </div>
                            
                <div class="mb-3">
                    <label for="bairro" class="form-label">Bairro</label>
                    <input type="text" id="bairro"  class="form-control" name="bairro" 
                    [(ngModel)]="bairro" readonly>
                </div>

                <div class="row g-3">
                    <div class="col-8">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" id="cidade"  class="form-control" name="cidade" 
                        [(ngModel)]="cidade" readonly>
                    </div>

                    <div class="col-4">
                        <label for="estado" class="form-label">Estado</label>
                        <input type="text" id="estado"  class="form-control" name="estado" 
                        [(ngModel)]="estado" readonly>
                    </div>
                </div>
                </section>

                <div class="col-12 form-acoes">
                    <button type="submit"
                            class="botao-cadastrar"
                            [disabled]="bloqueado"
                            [class.btnCarregando]="carregandoDados"
                            (click)="btnCadastroAnimacao()">{{btnCadastroTexto}}</button>
                    <p>Já tem uma conta?</p>
                    <a routerLink="/login">Acesse aqui</a>
                </div>
            </form>
        </main>
    </div>

</div>
